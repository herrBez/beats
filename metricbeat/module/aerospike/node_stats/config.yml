metrics:
  - name: batch_index_complete
    type: integer
    severity: optional
    description: Number of successfully completed batch index requests.
  - name: batch_index_created_buffers
    type: integer
    severity: optional
    description: Number of batch index buffers created.
  - name: batch_index_delay
    type: integer
    severity: optional
    description: Number of times a batch index request was delayed.
  - name: batch_index_destroyed_buffers
    type: integer
    severity: optional
    description: Number of batch index buffers destroyed.
  - name: batch_index_error
    type: integer
    severity: optional
    description: Number of batch index requests that failed with an error.
  - name: batch_index_huge_buffers
    type: integer
    severity: optional
    description: Number of huge batch index buffers allocated.
  - name: batch_index_initiate
    type: integer
    severity: optional
    description: Number of batch index requests initiated.
  - name: batch_index_proto_compression_ratio
    type: float
    severity: optional
    description: Compression ratio for batch index proto messages.
  - name: batch_index_proto_uncompressed_pct
    type: float
    severity: optional
    description: Percentage of uncompressed batch index proto messages.
  - name: batch_index_queue
    type: string
    severity: optional
    description: Queue depths for batch index requests.
  - name: batch_index_timeout
    type: integer
    severity: optional
    description: Number of batch index requests that timed out.
  - name: batch_index_unused_buffers
    type: integer
    severity: optional
    description: Number of batch index buffers that are currently unused.
  - name: client_connections
    type: integer
    severity: core
    description: Current number of open client connections.
  - name: client_connections_closed
    type: integer
    severity: core
    description: Total number of client connections closed since startup.
  - name: client_connections_opened
    type: integer
    severity: core
    description: Total number of client connections opened since startup.
  - name: cluster_clock_skew_ms
    type: integer
    severity: core
    description: Maximum clock skew in milliseconds observed in the cluster.
  - name: cluster_clock_skew_outliers
    type: integer
    severity: optional
    description: Number of nodes with clock skew issues.
  - name: cluster_clock_skew_stop_writes_sec
    type: integer
    severity: optional
    description: Time in seconds a node's writes were stopped due to clock skew.
  - name: cluster_duplicate_nodes
    type: string
    severity: optional
    description: Names of any nodes that are duplicates in the cluster.
  - name: cluster_generation
    type: integer
    severity: optional